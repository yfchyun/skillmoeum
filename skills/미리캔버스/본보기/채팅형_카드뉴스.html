<div style="position:absolute;inset:0;background:url(jeju6.jpg) center/cover"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,38,30,.55) 0%,rgba(20,38,30,.75) 50%,#14261E 92%)"></div>
<div style="position:absolute;left:72px;right:72px;top:110px"><div class="k">미리 궁금하실 것들</div>
<div class="serif" style="font-size:66px;margin-top:24px">AI는 목회자를<br><span class="y">대신하지 않습니다.</span></div>

<div style="position:absolute;left:72px;right:72px;top:640px;display:flex;flex-direction:column;gap:18px">
${[['컴퓨터에 익숙하지 않은데요?','설치부터 한 걸음씩 함께 하는 실습형입니다.'],['성도 개인 정보는요?','실제 민감한 정보는 넣지 않고, 맡길 것과 맡기지 않을 것의 기준을 함께 세웁니다.'],['돌아가서 혼자 쓸 수 있나요?','내 노트북·내 교회 자료로 실습해 그대로 이어 씁니다.']].map(q=>`<div style="background:rgba(244,238,223,.1);border:1.5px solid rgba(244,238,223,.3);border-radius:22px;padding:24px 30px"><div style="font-size:28px;font-weight:900"><span class="y">Q.</span> ${q[0]}</div><div style="font-size:23px;opacity:.8;margin-top:8px;line-height:1.5">${q[1]}</div></div>`).join('')}</div>
